<main class="wrap">
<section id="loginView" class="card driver-login"><h2>🚗 Masuk Driver</h2><p class="muted">Gunakan Kode Driver dan PIN.</p><input id="joinCode" type="text" placeholder="DoCar 01" autocomplete="username"><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="current-password"><button class="action" onclick="login()">Masuk</button><div id="loginError"></div></section>
<section id="appView" class="hidden"><div class="card"><div class="who"><div><h2 id="driverName">Driver</h2><p class="muted">Kode bergabung: <b id="driverCode">-</b></p></div><div class="online">🟢 Terhubung</div></div><button class="small logout" onclick="logout()">Keluar</button></div>
<div class="card"><h2>Status saya</h2><p class="muted">Tekan power switch pada status yang sesuai.</p><div id="statuses" class="status-list"></div></div>
<div class="card"><h2>👀 Driver dalam komunitas</h2><div id="board"></div></div></section></main>
<script>
const SUPABASE_URL='https://tausopeztiluvrpokgbf.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhdXNvcGV6dGlsdXZycG9rZ2JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mjg4MjIsImV4cCI6MjEwNzIwNDgyMn0.BB3obOY6pfQY1RYcsuZnTl-zTnR8NRk2k9pgyphP4M8';
const FUNCTION_URL=SUPABASE_URL+'/functions/v1/docar-admin-driver';
let token=localStorage.getItem('docar-driver-token')||'',community=null,me=null,drivers=[],statuses=[],timer=null;
const fallback=[{id:'ready',icon:'🟢',name:'Om Swastiastu',desc:'Siap menerima order',c:'#1b9a4a',bg:'#effaf2'},{id:'busy',icon:'🟡',name:'Memargi Antar',desc:'Sedang menjalankan order',c:'#d7a300',bg:'#fff9df'},{id:'offline',icon:'🔴',name:'Mesanekan',desc:'Sedang tidak tersedia',c:'#d83a3a',bg:'#fff1f1'},{id:'done',icon:'🙏',name:'Shanti...Shanti...Shanti',desc:'Order selesai',c:'#737b76',bg:'#f1f3f2'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setErr(t){document.getElementById('loginError').innerHTML=t?'<div class="error">'+esc(t)+'</div>':''}
function statusOf(id){return statuses.find(x=>x.id===id)||fallback.find(x=>x.id===id)||fallback[0]}
async function call(body,auth=false){const h={'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY};h.Authorization='Bearer '+SUPABASE_ANON_KEY;
if(auth&&token)h['x-driver-token']=token;const r=await fetch(FUNCTION_URL,{method:'POST',headers:h,body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));return d}
async function login(){setErr('');const joinCode=document.getElementById('joinCode').value.trim(),pin=document.getElementById('pin').value.trim();if(!joinCode||!pin){setErr('Kode Driver dan PIN wajib diisi.');return}try{const r=await call({action:'login',join_code:joinCode,pin});token=r.token;localStorage.setItem('docar-driver-token',token);me={id:r.driver.id,name:r.driver.name,code:r.driver.join_code,status:r.driver.status_code};await load();}catch(e){setErr(e.message||'Login gagal.')}}
async function logout(){stop();token='';localStorage.removeItem('docar-driver-token');me=null;community=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden')}
async function load(){try{const r=await call({action:'board'},true);community=r.community;me={...me,...r.me,status:r.me.status_code};statuses=(r.statuses||[]).map(x=>({id:x.code,icon:x.icon,name:x.name,desc:x.description,c:x.color,bg:x.background}));drivers=r.drivers||[];render();startPolling();}catch(e){if(/sesi|session|tidak valid|habis/i.test(e.message)){logout();setErr(e.message)}else setErr(e.message)}}
async function setStatus(code){if(!me)return;try{const r=await call({action:'status',status_code:code},true);me.status=r.status_code;await load()}catch(e){alert('Status belum tersimpan: '+e.message)}}
function render(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('driverName').textContent=me.name;document.getElementById('driverCode').textContent=me.code;document.getElementById('statuses').innerHTML=statuses.map(s=>'<div class="status '+(me.status===s.id?'active':'')+'" style="--c:'+s.c+';--bg:'+s.bg+'"><div class="icon">'+s.icon+'</div><div class="info"><div class="name">'+esc(s.name)+'</div><div class="desc">'+esc(s.desc)+'</div></div><button class="power" onclick="setStatus(\''+s.id+'\')" aria-label="Pilih '+esc(s.name)+'"></button></div>').join('');document.getElementById('board').innerHTML=drivers.map(d=>{const s=statusOf(d.status_code);return '<div class="driver-row"><div class="avatar">'+esc((d.name||'?')[0].toUpperCase())+'</div><div class="driver-main"><div class="driver-name">'+esc(d.name)+'</div><span class="badge">'+s.icon+' '+esc(s.name)+'</span></div><span class="muted">'+esc(d.join_code)+'</span></div>'}).join('')||'<p class="muted">Belum ada driver lain.</p>'}
function stop(){if(timer){clearInterval(timer);timer=null}}
function startPolling(){stop();timer=setInterval(async()=>{if(token&&me)await load()},5000)}
if(token)load();
</script></body></html>
